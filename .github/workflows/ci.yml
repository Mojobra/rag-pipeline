name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Run deterministic tests with branch coverage
        run: uv run coverage run -m unittest discover -s tests

      - name: Enforce coverage floor
        run: uv run coverage report

      - name: Build wheel and source distribution
        run: uv build

  container-check:
    name: Build and smoke-test container
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build container image
        run: docker build --tag rag-pipeline:ci .

      - name: Smoke-test CLI and API liveness
        shell: bash
        run: |
          docker run --rm rag-pipeline:ci rag-pipeline --version
          container_id=$(docker run --detach --rm \
            --env RAG_API_BEARER_TOKEN=ci-only-placeholder-token-000000000000 \
            --publish 127.0.0.1:8000:8000 rag-pipeline:ci)
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$container_id"
          exit 1

  publish-container:
    name: Publish versioned container
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out full release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify annotated release tag and mainline commit
        shell: bash
        run: python scripts/verify_release_tag.py "$GITHUB_REF_NAME"

      - name: Build container image
        run: |
          docker build --tag rag-pipeline:ci \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" .

      - name: Smoke-test CLI and API liveness
        shell: bash
        run: |
          docker run --rm rag-pipeline:ci rag-pipeline --version
          container_id=$(docker run --detach --rm \
            --env RAG_API_BEARER_TOKEN=ci-only-placeholder-token-000000000000 \
            --publish 127.0.0.1:8000:8000 rag-pipeline:ci)
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$container_id"
          exit 1

      - name: Publish to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_REF_NAME"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          docker tag rag-pipeline:ci "$image"
          docker push "$image"
